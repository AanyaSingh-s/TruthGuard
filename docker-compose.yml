services:
  truthguard-db:
    image: pgvector/pgvector:pg16
    container_name: truthguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truthguard}
      POSTGRES_USER: ${POSTGRES_USER:-truthguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truthguard_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truthguard} -d ${POSTGRES_DB:-truthguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgvector_data:
    driver: local
