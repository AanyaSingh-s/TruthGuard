server:
  port: 0

spring:
  application:
    name: truthguard-backend-test
  datasource:
    url: jdbc:h2:mem:truthguard_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

truthguard:
  storage:
    upload-dir: ./target/test-storage/uploads
  ai-service:
    url: http://localhost:8000

logging:
  level:
    root: WARN
    com.truthguard: INFO
