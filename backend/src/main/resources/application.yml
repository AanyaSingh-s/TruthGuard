server:
  port: 8080

spring:
  application:
    name: truthguard-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/truthguard}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

truthguard:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./storage/uploads}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:45000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.truthguard: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
